services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DATABASE_URL_ADMIN: solo para aplicar migraciones (rol superusuario del contenedor db)
      DATABASE_URL_ADMIN: postgresql://${POSTGRES_ADMIN_USER:-postgres}:${POSTGRES_ADMIN_PASSWORD:-postgres_dev_password}@db:5432/${POSTGRES_DB:-crm}
      # DATABASE_URL: el backend SIEMPRE se conecta con app_role (sin bypass de RLS)
      DATABASE_URL: postgresql://app_role:${APP_ROLE_PASSWORD:-app_role_dev_password_change_me}@db:5432/${POSTGRES_DB:-crm}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  db_data:
